[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dynamo-serve"
version = "0.1.0"
description = "Production-grade distributed LLM inference infrastructure with KV cache-aware scheduling, multi-node GPU placement, and SLA-based admission control — inspired by NVIDIA Dynamo and Blackwell-era serving systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "aryan", email = "aryansputta@gmail.com"}
]
keywords = ["llm", "inference", "kv-cache", "scheduling", "gpu", "distributed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "flask>=3.0",
    "prometheus-client>=0.20",
    "pydantic>=2.5",
    "rich>=13.7",
    "click>=8.1",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
dynamo-serve = "dynamo_serve.cli:main"
dynamo-bench = "benchmarks.run_benchmarks:main"
dynamo-dashboard = "dashboard.app:main"

[project.urls]
Homepage = "https://github.com/aryanputta/dynamo-serve"
Repository = "https://github.com/aryanputta/dynamo-serve"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
